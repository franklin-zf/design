<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Swiss Spacing</title><link rel="stylesheet" href="../tokens.css"><style>body{font-family:var(--font-body);background:var(--surface);color:var(--text);margin:0;padding:40px}.row{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center;margin:16px 0}.bar{height:24px;background:var(--accent)}</style></head>

</html>
