<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Swiss Colors</title><link rel="stylesheet" href="../tokens.css"><style>body{font-family:var(--font-body);background:var(--surface);color:var(--text);margin:0;padding:40px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.swatch{border:1px solid var(--line);padding:16px;background:var(--panel)}.chip{height:80px;margin-bottom:12px}</style></head>
<body><main><h1>Swiss colors</h1><section class="grid"><div class="swatch"><div class="chip" style="background:var(--surface)"></div>surface</div><div class="swatch"><div class="chip" style="background:var(--text)"></div>text</div><div class="swatch"><div class="chip" style="background:var(--accent)"></div>accent</div><div class="swatch"><div class="chip" style="background:var(--accent-2)"></div>marker only</div></section></main></body>
</html>
