<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expressive Web Stage System Spacing</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../layouts.css">
</head>
<body>
  <main class="ds-preview">
    <p class="ds-kicker">Expressive Web Stage System</p>
    
    <h1>Spacing rhythm</h1>
    <div style="margin-top:32px;display:grid;gap:18px">
      <div><code>page / clamp(24px, 5vw, 80px)</code><div style="margin-top:6px;width:clamp(24px, 5vw, 80px);max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>section / clamp(72px, 12vw, 180px)</code><div style="margin-top:6px;width:clamp(72px, 12vw, 180px);max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>gap / clamp(16px, 2.4vw, 36px)</code><div style="margin-top:6px;width:clamp(16px, 2.4vw, 36px);max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>tight / 8px</code><div style="margin-top:6px;width:8px;max-width:100%;height:18px;background:var(--accent)"></div></div>
    </div>
  </main></body>
</html>
