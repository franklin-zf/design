<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expressive Web Stage System Colors</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../layouts.css">
</head>
<body>
  <main class="ds-preview">
    <p class="ds-kicker">Expressive Web Stage System</p>
    
    <h1>Color roles</h1>
    <div class="ds-token-grid">
      <div><span style="background:#090909"></span><strong>surface</strong><code>#090909</code></div><div><span style="background:#171717"></span><strong>surface_alt</strong><code>#171717</code></div><div><span style="background:#F2F0E9"></span><strong>text</strong><code>#F2F0E9</code></div><div><span style="background:#AAA79F"></span><strong>muted</strong><code>#AAA79F</code></div><div><span style="background:#45433F"></span><strong>line</strong><code>#45433F</code></div><div><span style="background:#E42D24"></span><strong>accent</strong><code>#E42D24</code></div><div><span style="background:#080000"></span><strong>inverse_text</strong><code>#080000</code></div><div><span style="background:#B8BAB8"></span><strong>steel</strong><code>#B8BAB8</code></div>
    </div>
    <style>
      .ds-token-grid{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
      .ds-token-grid div{display:grid;gap:8px}.ds-token-grid span{height:96px;border:1px solid var(--line)}
      .ds-token-grid code{color:var(--muted)}
    </style>
  </main></body>
</html>
