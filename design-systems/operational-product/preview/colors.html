<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operational Product System Colors</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../layouts.css">
</head>
<body>
  <main class="ds-preview">
    <p class="ds-kicker">Operational Product System</p>
    
    <h1>Color roles</h1>
    <div class="ds-token-grid">
      <div><span style="background:#F3F6FA"></span><strong>surface</strong><code>#F3F6FA</code></div><div><span style="background:#FFFFFF"></span><strong>panel</strong><code>#FFFFFF</code></div><div><span style="background:#E9EEF5"></span><strong>panel_alt</strong><code>#E9EEF5</code></div><div><span style="background:#172033"></span><strong>text</strong><code>#172033</code></div><div><span style="background:#5F6B7A"></span><strong>muted</strong><code>#5F6B7A</code></div><div><span style="background:#D6DEE8"></span><strong>line</strong><code>#D6DEE8</code></div><div><span style="background:#245EA8"></span><strong>accent</strong><code>#245EA8</code></div><div><span style="background:#26705A"></span><strong>positive</strong><code>#26705A</code></div><div><span style="background:#8A5B00"></span><strong>warning</strong><code>#8A5B00</code></div><div><span style="background:#B33A32"></span><strong>danger</strong><code>#B33A32</code></div>
    </div>
    <style>
      .ds-token-grid{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
      .ds-token-grid div{display:grid;gap:8px}.ds-token-grid span{height:96px;border:1px solid var(--line)}
      .ds-token-grid code{color:var(--muted)}
    </style>
  </main></body>
</html>
