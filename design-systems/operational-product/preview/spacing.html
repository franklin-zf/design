<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operational Product System Spacing</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../layouts.css">
</head>
<body>
  <main class="ds-preview">
    <p class="ds-kicker">Operational Product System</p>
    
    <h1>Spacing rhythm</h1>
    <div style="margin-top:32px;display:grid;gap:18px">
      <div><code>page / 24px</code><div style="margin-top:6px;width:24px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>section / 20px</code><div style="margin-top:6px;width:20px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>gap / 12px</code><div style="margin-top:6px;width:12px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>tight / 6px</code><div style="margin-top:6px;width:6px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>row_inset / 14px</code><div style="margin-top:6px;width:14px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>control_compact / 32px</code><div style="margin-top:6px;width:32px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>control_regular / 40px</code><div style="margin-top:6px;width:40px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>control_touch / 44px</code><div style="margin-top:6px;width:44px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>icon_box / 20px</code><div style="margin-top:6px;width:20px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>icon_text_gap / 6px</code><div style="margin-top:6px;width:6px;max-width:100%;height:18px;background:var(--accent)"></div></div>
    </div>
  </main></body>
</html>
