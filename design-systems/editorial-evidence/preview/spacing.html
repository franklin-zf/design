<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial Evidence System Spacing</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../layouts.css">
</head>
<body>
  <main class="ds-preview">
    <p class="ds-kicker">Editorial Evidence System</p>
    
    <h1>Spacing rhythm</h1>
    <div style="margin-top:32px;display:grid;gap:18px">
      <div><code>page / clamp(24px, 6vw, 92px)</code><div style="margin-top:6px;width:clamp(24px, 6vw, 92px);max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>section / 72px</code><div style="margin-top:6px;width:72px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>gap / 24px</code><div style="margin-top:6px;width:24px;max-width:100%;height:18px;background:var(--accent)"></div></div><div><code>tight / 8px</code><div style="margin-top:6px;width:8px;max-width:100%;height:18px;background:var(--accent)"></div></div>
    </div>
  </main></body>
</html>
