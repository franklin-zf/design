<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editorial Evidence System Colors</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../layouts.css">
</head>
<body>
  <main class="ds-preview">
    <p class="ds-kicker">Editorial Evidence System</p>
    
    <h1>Color roles</h1>
    <div class="ds-token-grid">
      <div><span style="background:#F3F0E8"></span><strong>surface</strong><code>#F3F0E8</code></div><div><span style="background:#FCFBF7"></span><strong>paper</strong><code>#FCFBF7</code></div><div><span style="background:#201D18"></span><strong>text</strong><code>#201D18</code></div><div><span style="background:#716B61"></span><strong>muted</strong><code>#716B61</code></div><div><span style="background:#D8D1C4"></span><strong>line</strong><code>#D8D1C4</code></div><div><span style="background:#A23D2F"></span><strong>accent</strong><code>#A23D2F</code></div><div><span style="background:#28566B"></span><strong>secondary</strong><code>#28566B</code></div>
    </div>
    <style>
      .ds-token-grid{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
      .ds-token-grid div{display:grid;gap:8px}.ds-token-grid span{height:96px;border:1px solid var(--line)}
      .ds-token-grid code{color:var(--muted)}
    </style>
  </main></body>
</html>
