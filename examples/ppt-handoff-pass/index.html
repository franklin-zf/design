<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PPT Handoff</title><style>body{margin:0;overflow:hidden;background:#f4f4f0;color:#111111;font:18px/1.35 Inter,system-ui,sans-serif}.deck{display:flex;width:100vw;height:100vh}.slide{flex:0 0 100vw;height:100vh;padding:8vh 7vw}.dark{background:#111111;color:#f4f4f0}h1{font-size:80px;letter-spacing:0}h2{font-size:56px;letter-spacing:0}@media(max-width:760px){body{overflow:auto}.deck{width:100%;height:auto;display:block}.slide{min-height:100vh;height:auto;padding:40px 24px}h1{font-size:52px;line-height:1.05}h2{font-size:38px;line-height:1.1}}</style></head><body><main class="deck" data-design-id="ppt-handoff" data-style-preset="swiss-deck"><section class="slide" data-layout="D01-cover" data-purpose="cover"><h1 data-summary-id="ppt-title">PPT handoff package</h1><p data-summary-id="ppt-subtitle">HTML deck plus conversion notes.</p></section><section class="slide dark" data-layout="D12-closing" data-purpose="close"><h2 data-summary-id="ppt-close">Convert with native deck runtime when available</h2><p data-summary-id="ppt-source">Keep slide plan and source notes attached.</p></section></main></body></html>
