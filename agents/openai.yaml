interface:
  display_name: "Design"
  short_description: "Accurate visual artifacts with content-specific taste and clear quality gates"
  default_prompt: "Use $design to turn current source content and product requirements into an accurate, content-specific artifact. Clarify missing type, goal, or scenario with 2-3 directions. Preserve source identity, meaning, and exact values; compute derived values with code. Bind every P0/P1 requirement to current acceptance evidence. Poster owns the content handoff. Designer forms the Taste Contract before selecting a profile or production system and runs the source-verified Dribbble reference pass when the user requests inspiration or a net-new direction has no accepted brand system. Resolve color through the profile's color contract and verify actual rendered states. Open Standard and Assured work compares two independently structured directions bound to the same content, then captures first-viewport, dense-content, critical-state, and narrow-screen keyframes before full build. For PRD-backed prototypes, Reviewer must invoke browser automation, execute every P0/P1 content, functional, interaction, and responsive path, and bind browser-test evidence; static inspection cannot substitute. Reviewer checks source fidelity, actual-size surfaces, craft, and content ownership through non-compensating gates. Structural tests do not prove aesthetics. Deliver requirement coverage, Lane, Proven, Not proven, and Next."
policy:
  allow_implicit_invocation: true
