interface:
  display_name: "Design"
  short_description: "Accurate visual artifacts with content-specific taste and clear quality gates"
  default_prompt: "Use $design to turn current source content and product requirements into an accurate, content-specific artifact. Clarify missing type, goal, or scenario with 2-3 directions. Preserve source identity, meaning, and exact values; compute derived values with code. Bind every P0/P1 requirement to current acceptance evidence. Poster owns the content handoff. Designer forms the Taste Contract and experience intent before selecting a profile or implemented production system. Resolve color through the profile's color contract with stable foundation, focal, semantic, and data roles; verify declared pairings and actual rendered states. Open Standard and Assured work compares two independently structured directions bound to the same content, then captures first-viewport, dense-content, critical-state, and narrow-screen keyframes before full build. Reviewer checks requirements, source fidelity, actual-size surfaces, craft, and content ownership through non-compensating gates. Structural tests do not prove aesthetics; candidate-ready craft and ownership dimensions need evidence-backed scores of at least 3/4. Report human comprehension and blind preference as unproven until real evidence exists. Deliver requirement coverage, Lane, Proven, Not proven, and Next."
policy:
  allow_implicit_invocation: true
