<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poster Artifact</title>
  <style>
    :root {
      --surface: #f4f4f0;
      --ink: #111111;
      --muted: #5f625f;
      --line: #d8d8d0;
      --accent: #0047ff;
      --marker: #d7ff00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--surface);
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .poster {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      padding: clamp(24px, 5vw, 72px);
      border-top: 12px solid var(--ink);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 32vw);
      align-items: center;
      gap: clamp(28px, 5vw, 72px);
      padding: 6vh 0;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(56px, 11vw, 148px);
      line-height: .88;
      letter-spacing: 0;
    }

    .message {
      max-width: 54ch;
      margin-top: 28px;
      color: var(--muted);
      font-size: clamp(18px, 2.4vw, 28px);
      line-height: 1.35;
    }

    .hook {
      aspect-ratio: 1;
      border: 2px solid var(--ink);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .hook::before,
    .hook::after {
      content: "";
      position: absolute;
      background: var(--accent);
    }

    .hook::before {
      width: 66%;
      height: 16%;
      transform: rotate(-18deg);
    }

    .hook::after {
      width: 18%;
      height: 70%;
      background: var(--marker);
      mix-blend-mode: multiply;
      transform: rotate(18deg);
    }

    .foot {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      border-top: 1px solid var(--line);
      padding-top: 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .stage,
      .foot {
        grid-template-columns: 1fr;
      }

      .hook {
        width: min(100%, 320px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <main class="poster" data-design-id="poster-root" data-style-preset="swiss-deck" data-poster-id="poster-id">
    <div class="meta">
      <span>Audience</span>
      <span>Source-backed poster</span>
    </div>
    <section class="stage" aria-labelledby="poster-title">
      <div>
        <h1 id="poster-title">核心信息</h1>
        <p class="message">一句直接、清晰、保留原意的说明。</p>
      </div>
      <div class="hook" aria-hidden="true"></div>
    </section>
    <footer class="foot">
      <span>Source: local source material</span>
      <span>design-artifact/v1</span>
    </footer>
  </main>
</body>
</html>
