<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="../runtime/human-factors.css">
  <style>
    :root { --bg:#f4f4f0; --text:#111; --muted:#5f6368; --accent:#0047ff; --panel:#fff; --line:#d7d7d2; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:18px/1.35 Inter,Helvetica,Arial,sans-serif; }
    .deck { width:100vw; height:100vh; display:flex; transition:transform .32s ease; }
    .slide { flex:0 0 100vw; height:100vh; padding:6vh 6vw; display:grid; grid-template-rows:auto 1fr auto; gap:28px; }
    .slide.dark { background:#111; color:#f7f7f2; --muted:#b8b8b0; --line:#333; --panel:#1d1d1b; }
    h1 { max-width:10em; font-size:clamp(52px,9vw,132px); line-height:.9; margin:0; letter-spacing:0; text-wrap:balance; }
    h2 { max-width:16em; font-size:clamp(34px,5vw,76px); line-height:.96; margin:0; letter-spacing:0; text-wrap:balance; }
    p { max-width:820px; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:20px; align-items:center; }
    .panel { background:var(--panel); border:1px solid var(--line); padding:28px; }
    .mega { font-size:clamp(84px,16vw,220px); font-weight:800; line-height:.82; color:var(--accent); }
    .meta { color:var(--muted); font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase; letter-spacing:.08em; }
    .nav { position:fixed; right:18px; bottom:14px; color:var(--muted); font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    img { max-width:100%; height:auto; display:block; }
    .claim-evidence { display:grid; grid-template-columns:7fr 5fr; gap:20px; align-items:center; }
    @media (max-width: 760px) {
      body { overflow:hidden; }
      .deck { height:100svh; }
      .slide { height:100svh; overflow:auto; padding:40px 24px 88px; }
      .claim-evidence { grid-template-columns:1fr; }
      h1 { font-size:44px; }
      h2 { font-size:34px; }
      .nav { display:none; }
    }
    main[data-artifact-type="ppt-handoff"][data-surface-mode="projection-fixed"] { display:grid; width:min(calc(100vw - 24px),1280px); height:auto; margin:0 auto; gap:12px; transform:none !important; }
    main[data-artifact-type="ppt-handoff"][data-navigation-mode="external-player"][data-surface-mode="projection-fixed"] > .slide { width:100%; height:auto; min-height:0; aspect-ratio:16 / 9; overflow:hidden; padding:clamp(12px,5vw,72px); }
    main[data-artifact-type="ppt-handoff"][data-surface-mode="projection-fixed"] h1 { max-width:10em; font-size:clamp(22px,7vw,96px); }
    main[data-artifact-type="ppt-handoff"][data-surface-mode="projection-fixed"] h2 { max-width:16em; font-size:clamp(18px,5vw,68px); }
  </style>
</head>
<body>
  <main class="deck" id="deck" data-design-id="html-deck" data-style-preset="swiss-deck"
        data-primary-preset="{{PRIMARY_PRESET}}"
        data-design-profile-digest="{{DESIGN_PROFILE_DIGEST}}"
        data-artifact-type="{{ARTIFACT_TYPE}}" data-navigation-mode="{{NAVIGATION_MODE}}"
        data-reading-pattern="{{READING_PATTERN}}"
        data-attention-context="{{ATTENTION_CONTEXT}}"
        data-usage-frequency="{{USAGE_FREQUENCY}}"
        data-input-context="{{INPUT_CONTEXT}}"
        data-interaction-intent="{{INTERACTION_INTENT}}"
        data-min-target-size="{{MINIMUM_TARGET_CSS_PX}}"
        data-human-factors-digest="{{HUMAN_FACTORS_DIGEST}}"
        data-surface-mode="projection-fixed">
    <section class="slide" data-layout="D01-cover" data-purpose="cover">
      <div class="meta">{{KICKER}}</div>
      <div><h1 data-summary-id="deck-title">{{TITLE}}</h1><p data-summary-id="deck-subtitle">{{SUBTITLE}}</p></div>
      <div class="meta">{{DATE_OR_AUTHOR}}</div>
    </section>
    <section class="slide dark" data-layout="D03-claim-evidence" data-purpose="core claim">
      <div class="meta">{{SECTION}}</div>
      <div class="claim-evidence">
        <div><h2 data-summary-id="deck-claim">{{CLAIM}}</h2><p data-summary-id="deck-claim-text">{{CLAIM_TEXT}}</p></div>
        <div class="panel">{{EVIDENCE}}</div>
      </div>
      <div class="meta">{{SOURCE}}</div>
    </section>
    <section class="slide" data-layout="D12-closing" data-purpose="close">
      <div class="meta">{{CLOSE_KICKER}}</div>
      <div><h2 data-summary-id="deck-close-title">{{CLOSE_TITLE}}</h2><p data-summary-id="deck-close-text">{{CLOSE_TEXT}}</p></div>
      <div class="meta">{{NEXT_STEP}}</div>
    </section>
  </main>
  <div class="nav" id="nav">1 / 3</div>
  <script>
    const deck = document.getElementById('deck');
    if (deck.dataset.artifactType === 'html-deck') {
      const nav = document.getElementById('nav');
      const slides = [...document.querySelectorAll('.slide')];
      let i = 0;
      function show(n, updateHash = true){
        i = Math.max(0, Math.min(slides.length - 1, n));
        deck.style.transform = `translateX(${-i * 100}vw)`;
        slides.forEach((slide, index) => slide.classList.toggle('is-active', index === i));
        nav.textContent = `${i + 1} / ${slides.length}`;
        const target = `#/${i + 1}`;
        if (updateHash && location.hash !== target) history.replaceState(null, '', target);
      }
      function showHash(){ const match = /^#\/(\d+)$/.exec(location.hash || ''); show(match ? Number(match[1]) - 1 : 0, false); }
      addEventListener('keydown', e => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.target instanceof Element && e.target.closest('a[href],button,input,select,textarea,[contenteditable="true"]')) return;
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { show(i + 1); e.preventDefault(); }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(i - 1); e.preventDefault(); }
        if (e.key === 'Home') { show(0); e.preventDefault(); }
        if (e.key === 'End') { show(slides.length - 1); e.preventDefault(); }
      });
      addEventListener('hashchange', showHash);
      showHash();
    }
  </script>
  <script src="../runtime/human-factors.js"></script>
</body>
</html>
