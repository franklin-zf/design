<!-- Standard Anti-Bleeding Switch Control Snippet -->
<button
  type="button"
  role="switch"
  aria-checked="true"
  aria-label="自动调优引擎"
  class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border border-black/10 bg-blue-600 transition-colors duration-200 ease-in-out focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 shadow-[inset_0_1px_2px_rgba(0,0,0,0.15)]"
>
  <span
    aria-hidden="true"
    class="pointer-events-none inline-block h-[18px] w-[18px] translate-x-5 translate-y-[2px] rounded-full bg-white shadow-[0_1px_3px_rgba(0,0,0,0.2),0_1px_1px_rgba(0,0,0,0.1)] transition duration-200 ease-in-out"
  ></span>
</button>
